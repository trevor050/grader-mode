[project]
name = "grader-mode"
version = "0.1.0"
description = "Pre-registered tutoring cue experiment on the Qwen3 ladder"
requires-python = ">=3.11,<3.14"
dependencies = [
  "modal==1.6.2",
  "datasets>=4.0,<5",
  "huggingface-hub>=0.34,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
  "statsmodels>=0.14.5,<0.15",
  "openai>=2,<3",
  "tiktoken>=0.12,<1",
  "python-dotenv>=1,<2",
]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
